<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;background:#f4f6fa;font-family:Arial,sans-serif;color:#172033">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center" style="padding:32px 16px">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:12px">
      <tr><td style="padding:32px">
        <p style="margin:0 0 24px;font-size:16px;font-weight:bold;letter-spacing:3px">MYCOO</p>
        <h1 style="margin:0 0 12px;font-size:24px">{{title}}</h1>
        <p style="margin:0 0 20px;color:#68748a;font-size:14px">{{company}}</p>
        <p style="margin:0 0 28px;font-size:16px;line-height:1.6;overflow-wrap:anywhere">{{message}}</p>
        <a href="{{link}}" style="display:inline-block;padding:14px 20px;background:#172033;color:#ffffff;text-decoration:none;border-radius:8px">Открыть уведомления</a>
        <p style="margin:28px 0 0;font-size:12px;color:#68748a">Уведомление о событии в вашей команде MyCOO.</p>
      </td></tr>
    </table>
  </td></tr></table>
</body></html>
