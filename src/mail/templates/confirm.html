<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Код подтверждения MyCOO</title>
</head>
<body style="margin: 0; padding: 0; background: #04070f; font-family: 'Manrope', 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; color: #c3d1e8;">
  <table role="presentation" style="width: 100%; border-collapse: collapse; background: #04070f;">
    <tr>
      <td align="center" style="padding: 40px 20px;">
        <table role="presentation" style="width: 100%; max-width: 580px; border-collapse: collapse;">
          <!-- Logo -->
          <tr>
            <td align="center" style="padding-bottom: 32px;">
              <svg width="56" height="56" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="16" cy="16" rx="13" ry="13" stroke="#38bdf8" stroke-width="1.6" opacity="0.85"/>
                <ellipse cx="16" cy="16" rx="13" ry="5" stroke="#8b85f8" stroke-width="1.1" opacity="0.6" transform="rotate(-24 16 16)"/>
                <circle cx="16" cy="16" r="3.6" fill="#eaf1fc"/>
                <circle cx="26.6" cy="9.4" r="2" fill="#38bdf8"/>
              </svg>
            </td>
          </tr>
          
          <!-- Main Card -->
          <tr>
            <td>
              <table role="presentation" style="width: 100%; border-collapse: collapse; background: linear-gradient(160deg, rgba(15, 24, 50, 0.72), rgba(8, 13, 30, 0.6)); border: 1px solid rgba(122, 162, 255, 0.14); border-radius: 12px; box-shadow: 0 0 0 1px rgba(4, 8, 18, 0.4), 0 24px 60px -28px rgba(2, 6, 18, 0.9);">
                
                <!-- Header -->
                <tr>
                  <td style="padding: 32px 40px 24px; border-bottom: 1px solid rgba(28, 42, 77, 0.7); text-align: center;">
                    <div style="font-family: 'Unbounded', 'Manrope', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #eaf1fc; margin-bottom: 8px;">
                      {{purposeTitle}}
                    </div>
                    <div style="font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: #8ea3c4; opacity: 0.5;">
                      MyCOO Security
                    </div>
                  </td>
                </tr>
                
                <!-- Content -->
                <tr>
                  <td style="padding: 40px;">
                    <!-- Greeting -->
                    <div style="font-size: 18px; color: #eaf1fc; margin-bottom: 32px; line-height: 1.5; text-align: center;">
                      Ваш код подтверждения
                    </div>
                    
                    <!-- Code Container -->
                    <table role="presentation" style="width: 100%; border-collapse: collapse; background: rgba(13, 21, 48, 0.6); border: 2px solid rgba(56, 189, 248, 0.3); border-radius: 12px; margin-bottom: 32px;">
                      <tr>
                        <td align="center" style="padding: 40px 24px;">
                          <div style="font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: #8ea3c4; margin-bottom: 16px;">
                            Код подтверждения
                          </div>
                          <div style="font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 42px; font-weight: 700; color: #38bdf8; letter-spacing: 0.15em; text-shadow: 0 0 26px rgba(56, 189, 248, 0.4); margin-bottom: 16px;">
                            {{code}}
                          </div>
                          <div style="font-size: 14px; color: #8ea3c4;">
                            Действителен <span style="color: #7dd3fc; font-weight: 600;">{{ttlMinutes}} мин</span>
                          </div>
                        </td>
                      </tr>
                    </table>
                    
                    <!-- Note -->
                    <div style="font-size: 13px; color: #8ea3c4; line-height: 1.6; text-align: center; padding: 16px; background: rgba(7, 12, 26, 0.5); border-radius: 6px;">
                      Если вы не запрашивали этот код, проигнорируйте это письмо.<br>
                      Никому не сообщайте этот код.
                    </div>
                  </td>
                </tr>
                
                <!-- Footer -->
                <tr>
                  <td style="padding: 24px 40px; border-top: 1px solid rgba(28, 42, 77, 0.7); text-align: center;">
                    <div style="font-size: 12px; color: #8ea3c4; opacity: 0.7;">
                      © 2026 MyCOO. Все права защищены.
                    </div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
